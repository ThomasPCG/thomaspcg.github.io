<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/layers.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas Lim</title>
    <meta
      name="description"
      content="Thomas Lim is a software engineer in Singapore building web applications where the logic underneath has to be exactly right: tax calculators, ledgers and data pipelines."
    />
    <meta name="theme-color" content="#eeeae1" />
    <script>
      // Light is the default. Apply a saved dark choice (preferences.theme) before first
      // paint so it never flashes light. Mirrors initialColorMode / applyColorMode in
      // use-color-mode.ts.
      try {
        if (JSON.parse(localStorage.getItem('preferences')).theme === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0d0d0c'
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230d0d0c'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia,serif' font-size='46' fill='%23ece7dd'%3ET%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
